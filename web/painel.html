<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendências · LoanHouse</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
  <script src="js/components/guarda-rota.js"></script>
</head>
<body>
  <header class="topo"><nav class="menu" data-menu></nav></header>
  <main class="conteudo">
    <header class="painel-topo">
      <div>
        <h1 class="painel-topo__titulo">Pendências</h1>
        <p class="painel-topo__subtitulo" data-mes-atual data-prefixo="Imóveis com pendências">Imóveis com pendências • Novembro de 2026</p>
      </div>
      <div class="usuario-chip">
        <span class="usuario-chip__avatar" data-usuario-iniciais></span>
        <span class="usuario-chip__nome" data-usuario-nome></span>
      </div>
    </header>

    <section class="alertas" data-alertas aria-live="polite"></section>

    <section class="secao-imoveis">
      <div class="secao-cabecalho">
        <div>
          <h2 class="secao-cabecalho__titulo">Imóveis com pendências</h2>
          <p class="secao-cabecalho__subtitulo" data-resumo-casas>Carregando imóveis...</p>
        </div>
      </div>

      <div class="grade-casas-continua" data-lista-pendencias></div>
    </section>
  </main>
  <script type="module" src="js/pages/painel.js"></script>
</body>
</html>
