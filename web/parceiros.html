<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parceiros · LoanHouse</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
  <script src="js/components/guarda-rota.js"></script>
</head>
<body>
  <header class="topo"><nav class="menu" data-menu></nav></header>
  <main class="conteudo">
    <header class="painel-topo">
      <div>
        <h1 class="painel-topo__titulo">Parceiros</h1>
        <p class="painel-topo__subtitulo">Contatos de prestadores de serviço para manutenção dos imóveis</p>
      </div>
      <div class="usuario-chip">
        <span class="usuario-chip__avatar" data-usuario-iniciais></span>
        <span class="usuario-chip__nome" data-usuario-nome></span>
      </div>
    </header>

    <section class="cartao-secao">
      <div class="secao-cabecalho">
        <div class="estoque-resumo" data-resumo-parceiros></div>
        <button id="btn-novo-parceiro" class="botao botao--primario botao--compacto" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>Novo parceiro</span>
        </button>
      </div>

      <div class="campo estoque-busca">
        <label for="busca-parceiros">Buscar prestador ou serviço</label>
        <input type="search" id="busca-parceiros" placeholder="Ex.: eletricista, encanador, João" autocomplete="off">
      </div>

      <p class="mensagem-erro" role="alert" data-erro-parceiros hidden></p>

      <div class="lista-fiadores" data-lista-parceiros>
        <p class="vazio">Carregando parceiros...</p>
      </div>
    </section>

    <div id="modal-parceiro" class="modal-confirmacao" hidden>
      <div class="modal-confirmacao__caixa modal-evento__caixa" role="dialog" aria-modal="true" aria-labelledby="modal-parceiro-titulo">
        <div class="modal-confirmacao__topo">
          <span class="modal-confirmacao__icone modal-confirmacao__icone--sucesso" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
          </span>
          <div class="modal-confirmacao__conteudo">
            <h3 id="modal-parceiro-titulo" class="modal-confirmacao__titulo" data-modal-parceiro-titulo>Novo parceiro</h3>
            <p class="modal-confirmacao__texto">Guarde o contato e a especialidade do prestador para acionar rápido.</p>
          </div>
        </div>

        <form id="form-parceiro" class="modal-evento__form" novalidate>
          <div class="campo">
            <label for="parceiro-nome">Nome do prestador *</label>
            <input type="text" id="parceiro-nome" name="nome" maxlength="80" placeholder="Ex.: Mestre Severino" required>
          </div>

          <div class="grade-campos grade-campos--2col">
            <div class="campo">
              <label for="parceiro-servico">Serviço / Especialidade *</label>
              <input type="text" id="parceiro-servico" name="servico" list="lista-servicos" maxlength="50" placeholder="Ex.: Eletricista" required>
              <datalist id="lista-servicos"></datalist>
            </div>
            <div class="campo">
              <label for="parceiro-telefone">Telefone / WhatsApp *</label>
              <input type="tel" id="parceiro-telefone" name="telefone" inputmode="numeric" maxlength="15" placeholder="(81) 90000-0000" required>
            </div>
          </div>

          <div class="campo">
            <label for="parceiro-observacoes">Observações</label>
            <textarea id="parceiro-observacoes" name="observacoes" rows="2" placeholder="Ex.: Atende urgências aos sábados, ótimo preço em hidráulica"></textarea>
          </div>

          <p id="parceiro-feedback" class="mensagem-erro" role="alert" hidden></p>

          <div class="modal-evento__acoes">
            <button type="button" id="btn-excluir-parceiro" class="botao botao--perigo botao--compacto" hidden>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              <span>Excluir</span>
            </button>
            <div class="modal-evento__acoes-direita">
              <button type="button" id="btn-cancelar-parceiro" class="botao botao--secundario botao--compacto">Cancelar</button>
              <button type="submit" id="btn-salvar-parceiro" class="botao botao--primario botao--compacto">Salvar</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>
  <script type="module" src="js/pages/parceiros.js"></script>
</body>
</html>
