<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Gerenciador Imobiliário</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
</head>
<body class="pagina-login">
  <main class="cartao-login">
    <h1>Gerenciador Imobiliário</h1>
    <form id="form-login" novalidate>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <p id="erro-login" class="mensagem-erro" role="alert" hidden></p>
      <button class="botao botao--primario" type="submit">Entrar</button>
    </form>
  </main>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
