name: Web - deploy no Firebase Hosting

# Precisa de: secret FIREBASE_SERVICE_ACCOUNT (JSON da conta de serviço)
#             variável FIREBASE_PROJECT_ID (Settings > Secrets and variables > Actions > Variables)
on:
  push:
    branches: [main]
    paths: ["web/**", "firebase.json"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
