name: Verificação diária de atrasos

# Roda todo dia às 06:00 de Recife (09:00 UTC). Também dá pra rodar à mão em Actions > Run workflow.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só mostrar o que mudaria, sem gravar no Firestore"
        type: boolean
        default: false
      data_referencia:
        description: "Data de referência opcional (AAAA-MM-DD). Vazio usa hoje em Recife"
        required: false
        type: string
        default: ""

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/atrasos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verificar atrasos e atualizar situação das casas
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DATA_REFERENCIA: ${{ inputs.data_referencia }}
          MODO_SIMULAR: ${{ inputs.simular }}
        run: |
          ARGS=""
          if [ "$MODO_SIMULAR" = "true" ]; then
            ARGS="$ARGS --simular"
          fi
          if [ -n "$DATA_REFERENCIA" ]; then
            ARGS="$ARGS --hoje=$DATA_REFERENCIA"
          fi
          node verificar-atrasos.mjs $ARGS
